<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Deepawali, Doctor Aishwarya ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd66b;--saf:#ff9933;--pink:#ffb3c7;--ink:#fff6e0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0b2b;color:var(--ink);font-family:Quicksand,system-ui,sans-serif}
#sky{position:fixed;inset:0;background:linear-gradient(#0b0a26,#33145f 48%,#8a2f72 82%,#c4467a 100%)}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle,#ffe9a8,rgba(255,153,51,.5) 40%,transparent 70%)}
#flash.f{animation:fl 1s}
@keyframes fl{0%{opacity:0;transform:scale(.2)}40%{opacity:.8}100%{opacity:0;transform:scale(2.6)}}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.steps{display:flex;gap:6px}.steps i{width:24px;height:6px;border-radius:9px;background:rgba(255,255,255,.22);transition:.5s}
.steps i.d{background:var(--gold)}.steps i.c{background:var(--saf);box-shadow:0 0 10px var(--saf)}
#lab{font-size:.78rem;opacity:.85;margin-left:6px}
.ic{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,214,107,.4);border-radius:20px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;transition:.2s}
.ic:hover{background:rgba(255,214,107,.25)}.ic:active{transform:scale(.93)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.scene{position:fixed;inset:0;display:flex;padding:70px 14px 24px;text-align:center;opacity:0;visibility:hidden;transform:scale(1.06);filter:blur(10px);transition:opacity .8s,transform .8s,filter .8s,visibility 0s .8s;z-index:2;overflow-y:auto;overflow-x:hidden}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .9s .3s,transform .9s .3s,filter .9s .3s}
.in{margin:auto;width:min(100%,540px);display:flex;flex-direction:column;align-items:center;gap:6px}
h1,h2{font-family:'Dancing Script',Georgia,cursive;margin:.2em 0;text-shadow:0 0 24px rgba(255,190,90,.7);outline:0}
h1{font-size:clamp(2.2rem,9vw,3.6rem)}h2{font-size:clamp(1.7rem,6.5vw,2.5rem)}
p{margin:.3em 0;line-height:1.5}.big{font-size:1.15rem;color:var(--gold)}
.btn{background:linear-gradient(135deg,#ffd66b,#ff9933);color:#4a1a00;border:0;border-radius:40px;padding:13px 28px;font:600 1.05rem Quicksand,sans-serif;cursor:pointer;box-shadow:0 6px 22px rgba(255,153,51,.5),0 0 0 3px rgba(255,214,107,.25);transition:.2s;margin-top:8px}
.btn:hover{transform:translateY(-3px) scale(1.04)}.btn:active{transform:scale(.94)}
.btn.sm{padding:9px 16px;font-size:.9rem;margin:4px}.btn:disabled{opacity:.55;filter:saturate(.4);cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.rv{display:none}.rv.show{display:block;animation:pop .8s both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.hs svg,.hs3 svg{width:min(100%,430px)}
.moon{position:absolute;top:70px;right:9%;width:54px;height:54px;border-radius:50%;box-shadow:inset -15px 5px 0 0 #ffe9a8,0 0 30px rgba(255,233,168,.45)}
.dys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,360px)}
.dy{background:none;border:0;padding:4px;cursor:pointer;border-radius:16px;transition:.2s}.dy:hover{transform:translateY(-4px)}.dy:active{transform:scale(.92)}
.fl,.tf{transform-box:fill-box;transform-origin:50% 100%}
.fl{opacity:0;transform:scale(0)}.aura{opacity:0}
.lit .fl{opacity:1;animation:fk .5s infinite alternate ease-in-out}
.lit .aura{opacity:1;animation:au 1.6s infinite alternate}
.tf{animation:fk .5s infinite alternate ease-in-out}
@keyframes fk{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.88,1.12) skewX(4deg)}}
@keyframes au{from{transform:scale(.9);opacity:.7}to{transform:scale(1.1);opacity:1}}
.aura{transform-box:fill-box;transform-origin:center}
.win{animation:wg 2.5s infinite alternate}@keyframes wg{to{opacity:.7}}
.dg{opacity:0;transform:scale(.5);transform-box:fill-box;transform-origin:center bottom}
.dg.on{opacity:1;transform:none;transition:.9s cubic-bezier(.3,1.5,.5,1)}
.bulb{animation:bl 1.6s infinite}.bulb:nth-child(odd){animation-delay:.8s}@keyframes bl{50%{opacity:.3}}
.smk{animation:sm 4s infinite ease-out;opacity:0}.smk+.smk{animation-delay:2s}
@keyframes sm{0%{opacity:0;transform:translateY(10px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-26px) scaleX(1.4)}}
#bell{transform-origin:200px 24px;transform-box:view-box}#bell.ring{animation:rg 1.4s}
@keyframes rg{10%{transform:rotate(18deg)}30%{transform:rotate(-14deg)}50%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}}
.petal{position:fixed;top:-24px;z-index:4;pointer-events:none;border-radius:80% 0 80% 0;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}
.hr{position:fixed;bottom:-40px;z-index:3;pointer-events:none;text-shadow:0 0 12px currentColor;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) translateX(30px);opacity:0}}
.card{background:rgba(40,16,70,.55);border:1px solid rgba(255,214,107,.45);backdrop-filter:blur(6px);border-radius:24px;padding:18px 20px;box-shadow:0 0 40px rgba(255,150,100,.3);text-align:left}
.card p{opacity:0;transform:translateY(12px)}
.scene.on .card p,.scene.on .sig{animation:rise .9s forwards;animation-delay:calc(var(--i)*.8s + 1.6s)}
@keyframes rise{to{opacity:1;transform:none}}
.sig{opacity:0;font-family:'Dancing Script',cursive;font-size:1.4rem;color:var(--gold)}
.hgl{width:130px;margin-bottom:-6px}.hgl circle{fill:#ffb3c7;animation:tw 2s infinite}
#again{animation:glow 1.8s infinite alternate}@keyframes glow{to{box-shadow:0 0 34px #ffd66b}}
.btn{background:linear-gradient(135deg,#ffe08a,#ff9fc0 60%,#ff9933);color:#5a1030;box-shadow:0 6px 22px rgba(255,120,170,.5),0 0 0 3px rgba(255,200,220,.3)}
h1,h2{text-shadow:0 0 22px rgba(255,150,190,.8),0 0 6px rgba(255,214,107,.5)}
.hr{opacity:.75}.card{border-color:rgba(255,179,199,.6);box-shadow:0 0 44px rgba(255,120,170,.35)}
.ask{opacity:0;margin-top:10px}.scene.on .ask{animation:rise .9s forwards;animation-delay:calc(var(--i)*.8s + 1.6s)}
#yes{animation:hb 1.2s infinite}@keyframes hb{50%{transform:scale(1.08)}}
#no{background:linear-gradient(135deg,#e8e0f0,#b9a9d6);color:#3a2a5a;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#nm{min-height:1.5em;color:var(--pink)}
@media(min-width:900px){.in{width:min(100%,640px)}.hs svg,.hs3 svg{width:min(100%,500px)}}
@media(max-width:480px){#top{padding:8px 10px;flex-wrap:wrap}#lab{display:none}.steps i{width:18px}.ic{padding:5px 9px;font-size:.78rem}.scene{padding:62px 10px 18px}.moon{width:38px;height:38px;top:62px;box-shadow:inset -10px 4px 0 0 #ffe9a8,0 0 24px rgba(255,233,168,.45)}.btn{padding:12px 22px}.card{padding:14px}.dys{gap:2px}}
@media(max-height:620px){.hs svg,.hs3 svg{width:min(100%,300px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.card p,.sig,.ask{opacity:1;transform:none}}
</style></head>
<body>
<div id="sky"><div id="stars"></div></div>
<canvas id="fx" aria-hidden="true"></canvas><div id="flash"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="g"><stop offset="0" stop-color="#ffd66b" stop-opacity=".75"/><stop offset="1" stop-color="#ff9933" stop-opacity="0"/></radialGradient>
<linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#fff4c2"/></linearGradient>
<radialGradient id="alt" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#e2792b"/><stop offset="1" stop-color="#6b1d3a"/></radialGradient>
</defs></svg>
<header id="top"><div style="display:flex;align-items:center"><div class="steps" role="img" aria-label="Progress"><i></i><i></i><i></i><i></i><i></i></div><span id="lab" aria-live="polite"></span></div>
<div><button class="ic" id="mu" aria-pressed="false" aria-label="Turn music on">🎵 Music</button> <button class="ic" id="sk" aria-label="Skip to next scene">Skip ⏭</button></div></header>
<main id="app"></main>
<script>
const $=(s,r=document)=>r.querySelector(s),R=Math.random,pick=a=>a[(R()*a.length)|0];
const LAB=['Let’s Create a Special Deepawali','Let’s Light the Diyas','Let’s Decorate the House','Ganesh & Lakshmi Pooja','Your Surprise'];
/* ---------- particles ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[],A=[];
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
for(let i=0;i<40;i++)A.push({x:R()*W,y:R()*H,s:.2+R()*.5,r:1+R()*2.2,p:R()*6});
const GC=['#ffd66b','#ff9933','#ffb3c7','#fff4c2'];
function burst(x,y,n=30,sp=3,g=.05,c=GC){for(let i=0;i<n;i++){const a=R()*6.28,s=1+R()*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g,l:0,m:55+R()*45,r:1.3+R()*1.6,c:pick(c)})}}
function heartB(x,y){for(let t=0;t<6.28;t+=.14)P.push({x,y,vx:3.5*Math.sin(t)**3,vy:-.22*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)),g:.004,l:0,m:110,r:2,c:'#ff8fb3'})}
let T=0;(function loop(){T+=.02;cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
for(const a of A){a.y-=a.s;a.x+=Math.sin(T+a.p)*.3;if(a.y<-8){a.y=H+8;a.x=R()*W}cx.globalAlpha=.25+.25*Math.sin(T*2+a.p);cx.fillStyle='#ffd66b';cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.3);cx.fill()}
for(let i=P.length-1;i>=0;i--){const p=P[i];p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;if(++p.l>=p.m){P.splice(i,1);continue}cx.globalAlpha=1-p.l/p.m;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()}
requestAnimationFrame(loop)})();
const st=$('#stars');for(let i=0;i<80;i++){const e=document.createElement('i'),s=1+R()*2;e.style.cssText=`left:${R()*100}%;top:${R()*70}%;width:${s}px;height:${s}px;animation-delay:${R()*3}s`;st.append(e)}
function petals(n,cols){for(let i=0;i<n;i++)setTimeout(()=>{const e=document.createElement('div'),w=8+R()*10;e.className='petal';e.style.cssText=`left:${R()*100}%;width:${w}px;height:${w*1.3}px;background:${pick(cols)};--dx:${(R()-.5)*240}px;animation-duration:${5+R()*4}s`;document.body.append(e);setTimeout(()=>e.remove(),9500)},i*60)}
function hearts(){const e=document.createElement('span'),s=14+R()*22;e.className='hr';e.textContent='♥';e.style.cssText=`left:${R()*100}%;font-size:${s}px;color:${pick(['#ff8fb3','#ffd66b','#ff6b9a'])};animation-duration:${6+R()*4}s`;document.body.append(e);setTimeout(()=>e.remove(),10500)}
/* ---------- audio (starts only after interaction) ---------- */
let AC,MG,muted=false;
function tone(f,v=.1,d=1.5){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d)}
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination);
[130.8,196].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g).connect(MG);o.start()});
const sc=[261.6,293.7,329.6,392,440,523.3,587.3];setInterval(()=>tone(pick(sc),.1,2.6),1100);ui()}catch(e){}}
function ui(){const b=$('#mu'),on=AC&&!muted;b.textContent=on?'🔊 Music':'🔇 Music';b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Mute music':'Unmute music')}
$('#mu').onclick=()=>{if(!AC)audio();else{muted=!muted;MG.gain.value=muted?0:.5;ui()}};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,e=>{if(!e.target.closest('#mu'))audio()}));
const ding=()=>{tone(880,.16,3);tone(1320,.08,2.5);tone(2200,.04,2)};
/* ---------- svg art ---------- */
const dIn=(r=34)=>`<circle class="aura" cx="50" cy="30" r="${r}" fill="url(#g)"/><path class="fl" d="M50 4C61 20 67 28 50 46C33 28 39 20 50 4Z" fill="url(#fg)"/><path d="M8 46Q50 102 92 46Q50 60 8 46Z" fill="#c2571a"/><ellipse cx="50" cy="46" rx="42" ry="7" fill="#e2792b"/><rect x="48" y="38" width="4" height="9" rx="2" fill="#3a2418"/>`;
const diya=()=>`<svg viewBox="0 0 100 90">${dIn()}</svg>`;
const sd=x=>`<g transform="translate(${x} 262)"><circle r="14" cy="-4" fill="url(#g)"/><path d="M-8 0Q0 10 8 0Z" fill="#c2571a"/><path class="tf" d="M0 -10C4 -4 5 -1 0 3C-5 -1 -4 -4 0 -10Z" fill="#ffd66b"/></g>`;
const toran=()=>{let s='';for(let i=0;i<=16;i++){const t=i/16,x=100+200*t,y=132+20*Math.sin(Math.PI*t);s+=`<circle cx="${x}" cy="${y}" r="7" fill="${i%2?'#ff9d1c':'#ffc928'}"/>`;if(i%2==0&&i>0&&i<16)s+=`<path d="M${x} ${y}v16" stroke="#3c8f4a" stroke-width="2"/><circle cx="${x}" cy="${y+20}" r="5" fill="#ff7a1a"/>`}return s};
const rang=()=>{let s='';const C=['#ff4d79','#ffd66b','#7b5cff','#ff9933'];for(let k=0;k<8;k++)s+=`<ellipse cy="-26" rx="9" ry="20" fill="${C[k%4]}" transform="rotate(${k*45})"/>`;for(let k=0;k<16;k++)s+=`<circle cx="${Math.sin(k*.39)*50}" cy="${-Math.cos(k*.39)*50}" r="3" fill="#fff"/>`;return`<g transform="translate(200 280) scale(1 .3)">${s}<circle r="10" fill="#fff"/></g>`};
const bulbs=()=>{let s='<path d="M70 124Q200 138 330 124" stroke="#555" fill="none"/>';for(let i=0;i<14;i++){const x=70+260*i/13;s+=`<circle class="bulb" cx="${x}" cy="${128+10*Math.sin(Math.PI*i/13)+(i%2?4:0)}" r="4" fill="${pick(['#ff6b9a','#ffd66b','#7be0ff','#a8ff9a'])}"/>`}return s};
const lant=()=>[60,340,92,308].map((x,i)=>`<g><path d="M${x} 100V${118+i*4}" stroke="#ffd66b"/><rect x="${x-10}" y="${118+i*4}" width="20" height="28" rx="9" fill="${i%2?'#ff9933':'#ff4d6d'}"/><path d="M${x-10} ${132+i*4}h20" stroke="#ffd66b"/><circle cx="${x}" cy="${132+i*4}" r="14" fill="url(#g)"/></g>`).join('');
const pot=x=>`<path d="M${x-12} 262h24l-4 -14h-16z" fill="#c2571a"/>`+[-8,0,8,-4,4].map((d,i)=>`<circle cx="${x+d}" cy="${240-(i>2?10:0)}" r="8" fill="${i%2?'#ff9d1c':'#ffc928'}"/>`).join('');
function house(d){return`<svg viewBox="0 0 400 300" role="img" aria-label="A little Indian house"><ellipse cx="200" cy="270" rx="190" ry="20" fill="#1b0f3a"/>
<rect x="80" y="120" width="240" height="140" rx="6" fill="#f3c9a0"/><rect x="70" y="108" width="260" height="18" rx="6" fill="#c2571a"/>
<path d="M170 108V90Q200 52 230 90V108Z" fill="#e2792b"/><path d="M200 54v-14" stroke="#ffd66b" stroke-width="3"/><circle cx="200" cy="38" r="5" fill="#ffd66b"/>
<path d="M90 108Q110 80 130 108Z" fill="#e2792b"/><path d="M270 108Q290 80 310 108Z" fill="#e2792b"/>
<path class="win" d="M105 202V162Q126 138 147 162V202Z" fill="#ffcf5a"/><path class="win" d="M253 202V162Q274 138 295 162V202Z" fill="#ffcf5a"/>
<path d="M126 148V202M105 180H147M274 148V202M253 180H295" stroke="#c2571a" stroke-width="3"/>
<path d="M172 260V190Q200 160 228 190V260Z" fill="#6b2a1a"/><circle cx="214" cy="226" r="3" fill="#ffd66b"/><rect x="160" y="258" width="80" height="8" rx="3" fill="#d9a77a"/>
${d?`<g class="dg d-toran">${toran()}</g><g class="dg d-rangoli">${rang()}</g><g class="dg d-lights">${bulbs()}</g><g class="dg d-lanterns">${lant()}</g><g class="dg d-flowers">${pot(112)}${pot(288)}${sd(150)}${sd(250)}${sd(70)}${sd(330)}</g>`:[70,110,150,250,290,330].map(sd).join('')}</svg>`}
function garland(){let s='';for(let i=0;i<=26;i++){const a=Math.PI+Math.PI*i/26;s+=`<circle cx="${200+160*Math.cos(a)}" cy="${120+100*Math.sin(a)}" r="6" fill="${i%2?'#ff9d1c':'#ffc928'}"/>`}return s}
const ganesh=`<g transform="translate(120 0)"><circle cy="165" r="62" fill="rgba(255,255,255,.14)" stroke="#ffd66b"/><ellipse cy="215" rx="38" ry="42" fill="#ff8a2b"/><ellipse cy="248" rx="42" ry="16" fill="#d6334a"/><ellipse cx="-31" cy="152" rx="16" ry="24" fill="#f28a2e"/><ellipse cx="31" cy="152" rx="16" ry="24" fill="#f28a2e"/><ellipse cy="152" rx="26" ry="28" fill="#ff9a3c"/><path d="M-18 130L-13 102-4 120 0 96 4 120 13 102 18 130Z" fill="#ffd66b"/><circle cx="-9" cy="148" r="2.6" fill="#3a1a10"/><circle cx="9" cy="148" r="2.6" fill="#3a1a10"/><path d="M0 156Q-4 190 14 200Q24 205 20 195Q8 190 8 158Z" fill="#f08a2c" stroke="#c2571a"/><path d="M-3 170L-12 182" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="-34" cy="218" r="8" fill="#ffd66b"/><circle cy="136" r="2.5" fill="#d6203f"/><g fill="#ff9acb"><ellipse cx="-22" cy="268" rx="9" ry="16" transform="rotate(-55 -22 268)"/><ellipse cx="22" cy="268" rx="9" ry="16" transform="rotate(55 22 268)"/><ellipse cy="272" rx="9" ry="16"/></g></g>`;
const laksh=`<g transform="translate(280 0)"><circle cy="165" r="62" fill="rgba(255,255,255,.14)" stroke="#ffd66b"/><path d="M-36 266Q-42 200 0 186Q42 200 36 266Z" fill="#d6203f" stroke="#ffd66b" stroke-width="2"/><path d="M-28 205Q-50 190 -50 160M28 205Q50 190 50 160" stroke="#f2b98a" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="-50" cy="154" r="9" fill="#ff9acb"/><circle cx="50" cy="154" r="9" fill="#ff9acb"/><path d="M30 222Q50 236 52 250" stroke="#f2b98a" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="52" cy="258" r="4" fill="#ffd66b"/><circle cx="46" cy="270" r="4" fill="#ffd66b"/><circle cx="-34" cy="232" r="7" fill="#f2b98a"/><path d="M-22 170Q-24 140 0 140Q24 140 22 170Z" fill="#2b1620"/><circle cy="166" r="19" fill="#f2b98a"/><path d="M-14 150L-9 124-3 140 0 118 3 140 9 124 14 150Z" fill="#ffd66b"/><circle cx="-7" cy="164" r="2" fill="#3a1a10"/><circle cx="7" cy="164" r="2" fill="#3a1a10"/><circle cy="157" r="2" fill="#d6203f"/><path d="M-5 174Q0 178 5 174" stroke="#a33" fill="none"/><g fill="#ff9acb"><ellipse cx="-22" cy="268" rx="9" ry="16" transform="rotate(-55 -22 268)"/><ellipse cx="22" cy="268" rx="9" ry="16" transform="rotate(55 22 268)"/><ellipse cy="272" rx="9" ry="16"/></g></g>`;
const altar=()=>`<svg viewBox="0 0 400 300" role="img" aria-label="Puja altar with Lord Ganesh and Maa Lakshmi"><path d="M40 292V120Q40 20 200 20Q360 20 360 120V292Z" fill="url(#alt)" stroke="#ffd66b" stroke-width="3"/>${garland()}${ganesh}${laksh}

let heart='';for(let i=0;i<40;i++){const t=i/40*6.283;heart+=`<circle cx="${20+16*Math.sin(t)**3}" cy="${18-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}" r="1.3" style="animation-delay:${i*.08}s"/>`}
function build(){$('#app').innerHTML=`
<section class="scene" aria-label="Scene 1"><div class="moon"></div><div class="in"><div class="hs">${house(0)}</div><h1 tabindex="-1">Hey Doctor Aishwarya ❤️</h1><p class="big">Something special is waiting for you...</p><p>Let’s celebrate a little festival of lights together.</p><p style="font-size:.9rem;opacity:.85">made with all my love, just for you 💕</p><button class="btn" data-a="next">Let’s Begin ✨</button></div></section>
<section class="scene" aria-label="Scene 2"><div class="in"><h2 tabindex="-1">Let’s Light the Diyas</h2><p>Every diya brings a little more light, happiness and love.</p><div class="dys">${Array.from({length:9},(_,i)=>`<button class="dy" data-a="dy" aria-pressed="false" aria-label="Light diya ${i+1}">${diya()}</button>`).join('')}</div><p id="c2" aria-live="polite">0 of 9 diyas lit</p><div id="d2" class="rv"><p class="big">Look how beautiful everything is getting! ❤️</p><button class="btn" data-a="next">Now Let’s Decorate!</button></div></div></section>
<section class="scene" aria-label="Scene 3"><div class="in"><h2 tabindex="-1">Let’s Decorate the House</h2><p>A little decoration, a little magic and lots of happiness.</p><div class="hs3">${house(1)}</div><div class="row">${DEC.map(d=>`<button class="btn sm" data-a="dec" data-k="${d[0]}">${d[1]}</button>`).join('')}</div><p id="c3" aria-live="polite">0 of 5 added</p><div id="d3" class="rv"><p class="big">Our little Diwali home is ready! 🏡</p><button class="btn" data-a="next">Time for Pooja 🙏</button></div></div></section>
<section class="scene" aria-label="Scene 4"><div class="in"><h2 tabindex="-1">Lord Ganesh &amp; Maa Lakshmi Pooja</h2><div style="width:min(100%,440px)">${altar()}</div><div class="row"><button class="btn sm" data-a="fl">Offer Flowers 🌸</button><button class="btn sm" data-a="pd">Light the Pooja Diya 🪔</button><button class="btn sm" data-a="bl">Ring the Bell 🔔</button></div><div id="d4" class="rv"><p>May Lord Ganesh remove every obstacle from your path, and may Maa Lakshmi bless your life with happiness, prosperity and endless love.</p><p class="big">One Last Surprise Awaits You...</p><button class="btn" data-a="next">Open Your Surprise ❤️</button></div></div></section>
<section class="scene" aria-label="Scene 5"><div class="in"><svg class="hgl" viewBox="0 0 40 40" aria-hidden="true">${heart}</svg><h1 tabindex="-1">Happy Deepawali ❤️</h1><p class="big">To My Favourite Person, Doctor Aishwarya</p><div class="card">${LETTER.map((l,i)=>`<p style="--i:${i}">${l}</p>`).join('')}</div><p class="sig" style="--i:${LETTER.length}">With lots of love,<br>Yours ❤️</p><div class="ask" id="ask" style="--i:${LETTER.length+2}"><p class="big" style="font-size:1.35rem">Will you celebrate all the upcoming Deepawalis with me? 🪔❤️</p><div class="row" style="gap:16px;min-height:64px;align-items:center"><button class="btn" id="yes" data-a="yes">Yes ❤️</button><button class="btn" id="no" data-a="no">No 💔</button></div><p id="nm" aria-live="polite"></p></div><div id="fin" class="rv"><h2>Yay! You said Yes! ❤️</h2><p class="big">Every Deepawali, every diya, every little moment... with you. 🪔💕</p><button class="btn" id="again" data-a="again">Celebrate Again ✨</button></div></div></section>`;
S=[...document.querySelectorAll('.scene')];n2=0;n3=0;fx={}}
let S,cur=-1,tm=[],n2,n3,fx;
function go(n){tm.forEach(clearInterval);tm=[];cur=n;const f=$('#flash');f.classList.remove('f');void f.offsetWidth;f.classList.add('f');
S.forEach((s,i)=>{s.classList.toggle('on',i==n);s.inert=i!=n;if(i==n)s.scrollTop=0});
document.querySelectorAll('.steps i').forEach((e,i)=>{e.className=i<n?'d':i==n?'c':''});$('#lab').textContent=LAB[n];$('#sk').style.display=n==4?'none':'';

if(n==0)tm.push(setInterval(()=>burst(W*(.12+R()*.76),H*(.1+R()*.25),26,2.6,.03,['#ffd66b','#ffb3c7','#fff']),2200));
if(n==4){const fire=()=>burst(W*(.1+R()*.8),H*(.1+R()*.4),60,4.5,.05);fire();tm.push(setInterval(fire,650),setInterval(()=>heartB(W*(.25+R()*.5),H*(.15+R()*.25)),2600),setInterval(hearts,450),setInterval(()=>petals(6,['#ff7aa8','#ff4d79','#ffb3c7']),2500));petals(18,['#ff7aa8','#ff4d79','#ffb3c7']);tm.push(setTimeout(()=>{const a=$('#ask');a&&a.scrollIntoView({behavior:'smooth',block:'center'})},(LETTER.length+2)*800+2400))}}

const act={
next:()=>go(cur+1),
again:()=>{build();go(0)},
dy(b,e){if(n2)return;const all=[...document.querySelectorAll('.dy')];const order=[all.indexOf(b),...all.keys()].filter((v,i,a)=>a.indexOf(v)==i);order.forEach((i,k)=>setTimeout(()=>{const d=all[i];d.classList.add('lit');d.setAttribute('aria-pressed','true');n2++;$('#c2').textContent=n2+' of 9 diyas lit';const[x,y]=ctr(d);burst(x,y-8,16,2,-.02);tone([523.3,587.3,659.3,784][k%4],.12,1.4)},k*160));setTimeout(()=>{
[0,300,600,900].forEach(t=>setTimeout(()=>burst(W*(.2+R()*.6),H*(.15+R()*.3),50,4,.05),t));petals(24,['#ffd66b','#ff9933']);$('#d2').classList.add('show')},1640)},
dec(b){$('.d-'+b.dataset.k).classList.add('on');b.disabled=true;n3++;$('#c3').textContent=n3+' of 5 added';const[x,y]=ctr(b);burst(x,y,24,3,.04);tone(pick([523.3,659.3,784]),.12,1.4);if(n3==5){setTimeout(()=>burst(W/2,H*.35,70,4.5,.05),200);$('#d3').classList.add('show')}},
fl(b){b.disabled=true;$('#fl4').classList.add('on');petals(40,['#ffc928','#ff9d1c','#ff7a1a']);fx.f=1;chk()},

const NM=['Hehe, nice try 😜','Oops, it ran away! 🏃','Aww, you can’t catch it 🥰','The only answer is Yes ❤️','Just say Yes, my love 🥺'];let nm=0;
function dodge(){const no=$('#no'),yes=$('#yes');if(!no)return;nm++;no.style.position='fixed';no.style.zIndex=20;no.style.transition='left .25s,top .25s';const w=no.offsetWidth,h=no.offsetHeight,y=yes.getBoundingClientRect();let l,t,k=0;do{l=10+R()*(W-w-20);t=70+R()*(H-h-90);k++}while(k<25&&l<y.right+20&&l+w>y.left-20&&t<y.bottom+20&&t+h>y.top-20);no.style.left=l+'px';no.style.top=t+'px';yes.style.fontSize=Math.min(1.05+nm*.12,1.7)+'rem';$('#nm').textContent=NM[(nm-1)%NM.length];tone(880,.06,.5)}
act.no=dodge;
act.yes=()=>{$('#ask').style.display='none';$('#fin').classList.add('show');[0,250,500,750,1000].forEach(t=>setTimeout(()=>{heartB(W*(.2+R()*.6),H*(.2+R()*.3));burst(W*R(),H*(.1+R()*.4),60,5,.05)},t));petals(40,['#ff7aa8','#ff4d79','#ffd66b']);[784,987.8,1174.7,1568].forEach((f,i)=>setTimeout(()=>tone(f,.12,2),i*160));$('#fin').scrollIntoView({behavior:'smooth',block:'center'})};

$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b,e)});

let lt=0;['pointerenter','pointerdown','touchstart','focus'].forEach(ev=>$('#app').addEventListener(ev,e=>{if(e.target.id!=='no')return;if(ev!=='focus'&&ev!=='pointerenter')e.preventDefault();if(Date.now()-lt<300)return;lt=Date.now();dodge()},{capture:true,passive:false}));
setInterval(()=>{if(cur<4)hearts()},1500);
build();go(0);
